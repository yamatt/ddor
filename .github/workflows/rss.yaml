name: Build RSS

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rss.yaml"
      - "door/**"

permissions:
  contents: read
  pages: write

jobs:
  build-rss:
    name: Build RSS feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Create RSS
        run: |
          mkdir public
          uv run -m ddor config/yamatt.toml public
      - name: Upload RSS
        uses: actions/upload-artifact@v5
        with:
          name: ddor-yamatt-rss
          path: public
      - name: Update site
        uses: actions/deploy-pages@v4

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
