name: Build RSS

on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rss.yaml"
      - "ddor/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-rss:
    name: Build RSS feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Create RSS
        run: |
          mkdir public
          uv run -m ddor config/yamatt.toml public
          # Create a simple index.html for the GitHub Pages site
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>DDOR - Daily Dose of Lemmy</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      max-width: 800px;
                      margin: 40px auto;
                      padding: 0 20px;
                      line-height: 1.6;
                      color: #333;
                  }
                  h1 { color: #2c3e50; }
                  a { color: #3498db; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  .rss-link {
                      display: inline-block;
                      padding: 10px 20px;
                      background: #e74c3c;
                      color: white;
                      border-radius: 5px;
                      margin: 20px 0;
                  }
                  .rss-link:hover { background: #c0392b; text-decoration: none; }
              </style>
          </head>
          <body>
              <h1>DDOR - Daily Dose of Lemmy</h1>
              <p>Curated RSS feed of top posts from Lemmy communities.</p>
              <a href="yamatt.rss" class="rss-link">📡 Subscribe to RSS Feed</a>
              <p>Add this feed to your RSS reader to get daily updates from selected Lemmy communities.</p>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
