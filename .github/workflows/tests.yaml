name: Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yaml"
      - "ddor/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - "ddor/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Run linters
        run: |
          uv run black --check --diff ddor
          uv run isort --check-only ddor
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Run pytest
        run: |
          uv run pytest tests/ -v
  security-scanner:
    name: Security Scanner
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Run Bandit
        run: |
          uv run bandit -r ddor
  rss-validator:
    name: Validate RSS Feed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Generate RSS feed
        run: |
          mkdir -p ./out
          uv run -m ddor config/test.toml ./out
      - name: Validate RSS XML structure (Alpine)
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:3.23
          options: -v ${{ github.workspace }}/out:/out
          run: |
            apk add --no-cache libxml2
            xmllint --noout --schema https://www.rssboard.org/rss-2-0-11.xsd /out/test.rss || \
            xmllint --noout /out/test.rss
