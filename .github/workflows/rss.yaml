name: Build RSS

on:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rss.yaml"
      - "ddor/**"
      - "config/*"
  workflow_dispatch:

concurrency:
  group: "{{ github.workflow }}-rss"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-rss:
    name: Build RSS feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: "auto"
      - name: "Set up Python"
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync
      - name: Create RSS
        timeout-minutes: 5
        run: |
          mkdir -p public
          uv run -m ddor config/yamatt.toml public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
